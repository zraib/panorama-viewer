version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - echo "Installing Python dependencies for build process"
        - |
          if command -v python3 &> /dev/null; then
            python3 -m pip install --user numpy
            echo "Python3 and NumPy installed successfully"
          elif command -v python &> /dev/null; then
            python -m pip install --user numpy
            echo "Python and NumPy installed successfully"
          else
            echo "Python not found, using Node.js alternatives for configuration generation"
          fi
    build:
      commands:
        - echo "Setting environment variables"
        - env | grep -E "(PANORAMA_|PANOR_AWS_|NEXT_PUBLIC_|MAX_|UPLOAD_|USE_)" > .env.production
        - echo "Building Next.js application"
        - npm run build
        - echo "Generating project configurations"
        - |
          if [ -d "public" ] && [ "$(ls -A public)" ]; then
            for project_dir in public/*/; do
              if [ -d "$project_dir" ] && [ -f "${project_dir}data/pano-poses.csv" ]; then
                project_name=$(basename "$project_dir")
                echo "Found existing project: $project_name"
                node scripts/node/generate-config.js --project "$project_name" || echo "Config generation failed for $project_name"
              fi
            done
          else
            echo "No existing projects found, skipping config generation"
          fi
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*