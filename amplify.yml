version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - echo "AWS Amplify deployment - using Node.js for configuration generation"
    build:
      commands:
        - echo "Setting environment variables for Next.js SSR"
        - env | grep -E "(PANOR_AWS_|USE_S3_STORAGE)" >> .env.production
        - env | grep -E "NEXT_PUBLIC_" >> .env.production
        - echo "Building Next.js application"
        - npm run build
        - echo "Configuration generation will be handled at runtime via API for S3 storage"
        - echo "Build completed successfully for AWS Amplify deployment"
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*